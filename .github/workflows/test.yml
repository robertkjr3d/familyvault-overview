name: Tests

# Runs on every push to the main working branch and on any PR targeting it.
# If a test fails, the push still deploys (Cloudflare auto-deploy is separate)
# but GitHub will show a red ✗ on the commit and email you.
on:
  push:
    branches: [azariah]
  pull_request:
    branches: [azariah]

jobs:
  test:
    name: Run vitest suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
